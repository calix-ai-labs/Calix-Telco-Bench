# Copy this file to config/local/ and customize it for your provider.
# Export TELCOBENCH_BASE_URL and TELCOBENCH_MODEL before running; keep any
# provider credential in the environment named by api_key_env.
schema_version: 1
protocol_id: telcobench-openai-compatible-example-v1

provider:
  kind: openai_compatible
  base_url: ${TELCOBENCH_BASE_URL}
  models_endpoint: /models
  chat_completions_endpoint: /chat/completions
  allow_missing_api_key: false

benchmark:
  # Paths are relative to this file, which lives in config/.
  manifest: ../datasets/MANIFEST.json
  prompts: ../prompts/generation-neutral-v1.yaml
  condition: neutral_deployment_like
  output_root: ../outputs/example-openai-compatible
  max_new_tokens: 1024

generation:
  temperature: 0.0
  top_p: 1.0
  seed: 42
  request_timeout_seconds: 180

targets:
  example_model:
    # Replace with the provider-visible model ID through the environment.
    model: ${TELCOBENCH_MODEL}
    # The value is an environment-variable name, never the credential itself.
    api_key_env: TELCOBENCH_API_KEY
    output: example-model
    routes: null
