[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calix-telco-bench"
version = "0.1.0"
description = "A benchmark for evaluating language models on telecommunications and network-infrastructure tasks."
readme = "README.md"
# Judge transport is validated against the same CPython 3.11 runtime as MOPD.
requires-python = ">=3.10,<3.13"
license = "AGPL-3.0-only"
authors = [{name = "MOPD contributors"}]
dependencies = ["PyYAML>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
huggingface = ["torch>=2.4", "transformers>=4.45", "safetensors>=0.4", "peft>=0.13"]
tui = ["rich>=13.7"]
# Match the audited MOPD evaluator transport version; later SDK versions have
# changed the compatibility behavior of the organization-hosted endpoint.
judge = ["anthropic==1.6.0", "httpx2==2.13.0"]
dev = ["pytest>=8.0"]

[project.scripts]
calix-telco-bench = "calix_telco_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
